<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="lin"><stop offset="0" stop-color="#ff0000"/><stop offset="1" stop-color="#0000ff"/></linearGradient>
    <linearGradient id="vert" x1="0" y1="0" x2="0" y2="1" xlink:href="#lin"/>
    <linearGradient id="user" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="100" y2="0">
      <stop offset="0%" style="stop-color:#000000"/><stop offset="100%" style="stop-color:#ffffff"/>
    </linearGradient>
    <radialGradient id="rad"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#00ff00" stop-opacity="1"/></radialGradient>
    <linearGradient id="refl" x2="0.5" spreadMethod="reflect"><stop offset="0" stop-color="#ff0000"/><stop offset="1" stop-color="#ffff00"/></linearGradient>
  </defs>
  <rect x="0" y="0" width="100" height="20" fill="url(#lin)"/>
  <rect x="0" y="25" width="20" height="40" fill="url(#vert)"/>
  <rect x="30" y="25" width="70" height="10" fill="url(#user)"/>
  <circle cx="65" cy="65" r="20" fill="url(#rad)"/>
  <rect x="0" y="90" width="100" height="10" fill="url(#refl)"/>
  <rect x="30" y="40" width="10" height="10" fill="url(#missing) #ff00ff"/>
</svg>
