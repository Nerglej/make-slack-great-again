<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 100 100">
  <defs>
    <rect id="sq" width="20" height="20"/>
    <symbol id="sym" viewBox="0 0 10 10"><circle cx="5" cy="5" r="5" fill="#00ff00"/></symbol>
    <g id="loop"><use href="#loop"/><rect width="1" height="1" fill="#000000"/></g>
  </defs>
  <use xlink:href="#sq" x="10" y="10" fill="#ff0000"/>
  <use href="#sq" x="60" y="10" style="fill:#0000ff"/>
  <use href="#sym" x="10" y="60" width="30" height="30"/>
  <use href="#loop" x="90" y="90"/>
  <use href="#nothing"/>
</svg>
