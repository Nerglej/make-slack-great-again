# The test suites, on every push and pull request: the release workflow only
# builds artifacts, so nothing else runs them. Linux only, because the suites
# use plat's headless backend and get a HOME of their own per test.
name: ci

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - name: Install the build dependencies
        run: scripts/configure-linux.sh
      # What a desktop has and a bare runner does not: a font from the UI's own
      # preference list (text/fonts.cpp kUiFamilies) and a spell dictionary.
      - name: Install the fonts and dictionary the suites render with
        run: sudo apt-get install -y --no-install-recommends fonts-inter hunspell-en-us
      - name: Build and run the test suites
        run: scripts/build.sh --test
